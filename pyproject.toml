[project]
name = "city-commander-agent"
version = "2.0.0"
description = "城市應變指揮官 — AI 交通決策系統"
authors = [
    { name = "chun hsuan", email = "hsuan069317@gmail.com" },
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pandas>=2.2",
    "boto3>=1.35",
    "strands-agents>=1.50.1",
    "strands-agents-tools>=0.1.0",
    "python-multipart>=0.0.9",
    "websockets>=13.0",
    "python-dotenv>=1.2.2,<2.0.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "hypothesis==6.164.0",
    "pytest==8.4.2",
    "pytest-asyncio==0.26.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-config", "--strict-markers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
